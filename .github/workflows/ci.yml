name: CI

on:
  push:
    branches:
      - master
      - "dev/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NODE_ENV: test
  BUN_VERSION: "1.4.5"

jobs:
  quality:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - check: Formatting
            command: bun fmt --check

          - check: Type checking
            command: bun check

          - check: Production build
            command: bun run build

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run check
        run: ${{ matrix.command }}

  tests:
    name: Tests and database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/everybuy_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/everybuy_test
      BETTER_AUTH_SECRET: everybuy-ci-only-secret-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3000
      FRONTEND_URL: http://localhost:5173

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: everybuy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d everybuy_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Check migration history
        run: bunx drizzle-kit check

      - name: Check for missing migrations
        run: |
          bun run db:generate

          if [ -n "$(git status --porcelain -- src/database/migrations)" ]; then
            git status --short -- src/database/migrations
            echo "::error::Generate and commit the missing Drizzle migrations."
            exit 1
          fi

      - name: Apply migrations to the test database
        run: bun run db:migrate
